name: vltv-deploy

services:
  postgres:
    image: postgres:18
    restart: unless-stopped
    environment:
      POSTGRES_DB: vltv
      POSTGRES_USER: vltv
      POSTGRES_PASSWORD: ${VLTV_DB_PASSWORD:?Set VLTV_DB_PASSWORD in .env}
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD", "pg_isready", "-h", "127.0.0.1", "-U", "vltv", "-d", "vltv"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 15s

  api:
    build:
      context: .
      dockerfile: server/Dockerfile
    restart: unless-stopped
    init: true
    environment:
      PGHOST: postgres
      PGDATABASE: vltv
      PGUSER: vltv
      PGPASSWORD: ${VLTV_DB_PASSWORD:?Set VLTV_DB_PASSWORD in .env}
      VLTV_ADMIN_USER: ${VLTV_ADMIN_USER:?Set VLTV_ADMIN_USER in .env}
      VLTV_ADMIN_PASSWORD: ${VLTV_ADMIN_PASSWORD:?Set VLTV_ADMIN_PASSWORD in .env}
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "from urllib.request import urlopen; urlopen('http://127.0.0.1:3101/health', timeout=3).close()"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

  web:
    build: ./web
    restart: unless-stopped
    init: true
    environment:
      VLTV_API_URL: http://api:3101
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "${VLTV_WEB_BIND:-127.0.0.1}:${VLTV_WEB_PORT:-8080}:3000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/agents/jett.webp', { method: 'HEAD', signal: AbortSignal.timeout(3000) }).then(response => { if (!response.ok) process.exitCode = 1 }).catch(() => { process.exitCode = 1 })"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  postgres-data:
