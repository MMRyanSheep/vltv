[package]
name = "vltv-api"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1"
axum = "0.8"
base64 = "0.22"
chrono = { version = "0.4", default-features = false, features = ["std"] }
http-body-util = "0.1"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp"] }
ring = "0.17"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio-rustls", "postgres", "json", "uuid", "chrono", "macros", "migrate"] }
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "time", "sync", "process", "io-util", "fs"] }
uuid = { version = "1", features = ["serde"] }
vltv = { path = ".." }
